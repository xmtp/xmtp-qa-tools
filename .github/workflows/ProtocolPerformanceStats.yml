name: Protocol Performance Stats
description: "Protocol performance stats for cross-repo parity"

on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [group-stats]
        size: [10-50]
        env: [dev, testnet-staging]
        cache-data: [false]
    env:
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      REGION: ${{ vars.REGION }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GROUP_STATS_MESSAGE_COUNT: 5
      XMTP_GATEWAY_HOST: ${{ matrix.env == 'testnet-staging' && secrets.XMTP_GATEWAY_HOST || '' }}
      LOGGING_LEVEL: debug
      LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@v4

      - name: Setup test env
        uses: ./.github/actions/xmtp-test-setup
        with:
          cache-data: ${{ matrix.cache-data }}
          test-name: ${{ matrix.test }}-${{ matrix.size }}
          env: ${{ matrix.env }}

      - name: Run tests ${{ matrix.size }}
        run: yarn test ${{ matrix.test }} --no-fail --log debug --winston debug --file --env ${{ matrix.env }} --size ${{ matrix.size }} --max-retry 1 --attempts 15

      - name: Print latest group-stats debug log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          latest_group_log="$(ls -1t logs/group-stats-${{ matrix.env }}-*.log 2>/dev/null | head -n 1 || true)"
          latest_raw_log="$(ls -1t logs/raw-group-stats-*.log 2>/dev/null | head -n 1 || true)"

          if [[ -n "${latest_group_log}" ]]; then
            echo "Latest group-stats log: ${latest_group_log}"
            tail -n 400 "${latest_group_log}"
          else
            echo "No group-stats log file found for env=${{ matrix.env }}"
          fi

          if [[ -n "${latest_raw_log}" ]]; then
            echo "Latest raw group-stats log: ${latest_raw_log}"
            tail -n 200 "${latest_raw_log}"
          else
            echo "No raw group-stats log file found"
          fi

          if [[ -f "/tmp/metric-debug.log" ]]; then
            echo "Metric debug (/tmp/metric-debug.log):"
            tail -n 400 /tmp/metric-debug.log
          else
            echo "No /tmp/metric-debug.log found"
          fi

      - name: Cleanup and upload artifacts
        if: always()
        uses: ./.github/actions/xmtp-test-cleanup
        with:
          save-to-cache: ${{ matrix.cache-data }}
          test-name: ${{ matrix.test }}-${{ matrix.size }}
          env: ${{ matrix.env }}

      - name: Send Slack notification on failure
        if: failure() || cancelled()
        uses: ./.github/actions/slack-notification
        with:
          workflow-name: "Protocol Performance Stats (${{ matrix.env }}, ${{ matrix.size }})"
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
